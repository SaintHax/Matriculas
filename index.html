<script>
(() => {

  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const validLetters = 'BCDFGHJKLMNPRSTVWXYZ';

  const modernRows = {
    2000:[null,null,null,null,null,null,null,null,'BBJ','BCD','BCY','BDR'],

    2012:['HJC','HJM','HKB','HKL','HKX','HLK','HLW','HMD','HML','HMT','HNC','HNK'],
    2013:['HNT','HPC','HPN','HPY','HRK','HRX','HSK','HSR','HSZ','HTK','HTV','HVF'],
    2014:['HVN','HVZ','HWM','HXB','HXN','HYD','HYT','HZB','HZL','HZZ','JBL','JBY'],
    2015:['JCK','JCY','JDR','JFG','JFW','JGP','JHJ','JHT','JJH','JJW','JKK','JKZ'],
    2016:['JLN','JMF','JMY','JNR','JPK','JRG','JRZ','JSL','JTB','JTR','JVH','JVZ'],
    2017:['JWN','JXF','JYB','JYT','JZP','KBM','KCH','KCV','KDK','KFB','KFV','KGN'],
    2018:['KHF','KHX','KJV','KKN','KLM','KML','KNK','KPD','KPR','KRJ','KRX','KSS'],
    2019:['KTH','KTZ','KVX','KWS','KXR','KYN','KZK','KZZ','LBN','LCG','LCY','LDR'],
    2020:['LFH','LFY','LGG','LGH','LGP','LHG','LJD','LJR','LKT','LKV','LLJ','LMC'],
    2021:['LMK','LMX','LNM','LPD','LPW','LRN','LSF','LSP','LTD','LTR','LVF','LVV'],
    2022:['LWD','LWP','LXC','LXR','LYH','LYZ','LZN','LZY','MBN','MCB','MCP','MDF'],
    2023:['MDR','MFF','MFY','MGM','MHG','MHZ','MJR','MKC','MKR','MLH','MLX','MMN'],
    2024:['MNC','MNS','MPL','MRD','MRY','MSS','MTK','MTW','MVL','MWC','MWV','MXP'],
    2025:['MYC','MYW','MZS','NBK','NCJ','NDD','NFC','NFR','NGJ','NHD','NHX','NJS'],
    2026:['NKF','NKY','NMZ','NMH','NNT','NPZ','NRR','NRX',null,null,null,null]
  };

  function idx(s){
    let n=0;
    for(const ch of s){
      const i=validLetters.indexOf(ch);
      if(i<0) return -1;
      n=n*validLetters.length+i;
    }
    return n;
  }

  const boundaries=[];
  for(const y of Object.keys(modernRows).map(Number).sort((a,b)=>a-b)){
    modernRows[y].forEach((letters,m)=>{
      if(letters) boundaries.push({year:y,month:m,index:idx(letters)});
    });
  }


  // Límites de fin de mes usando matrícula COMPLETA (número + letras).
  // Esto evita el error de comparar únicamente las tres letras.
  // 2020-2025: límites mensuales completos.
  // 2026: datos disponibles hasta el periodo actual.
  const modernFullMonthEnds = [
    [2020,0,'9806','LFF'],[2020,1,'9707','LFY'],[2020,2,'1878','LGF'],[2020,3,'1203','LGG'],
    [2020,4,'9642','LGP'],[2020,5,'5152','LHG'],[2020,6,'2497','LJC'],[2020,7,'3565','LJP'],
    [2020,8,'7565','LKD'],[2020,9,'2988','LKT'],[2020,10,'8062','LLJ'],[2020,11,'4579','LMB'],

    [2021,0,'6415','LMK'],[2021,1,'7629','LMX'],[2021,2,'5106','LNM'],[2021,3,'9365','LPC'],
    [2021,4,'5500','LPW'],[2021,5,'7978','LRN'],[2021,6,'1909','LSF'],[2021,7,'7629','LSP'],
    [2021,8,'2376','LTC'],[2021,9,'2543','LTP'],[2021,10,'4334','LVC'],[2021,11,'5577','LVV'],

    [2022,0,'7821','LWC'],[2022,1,'4525','LWP'],[2022,2,'4402','LWZ'],[2022,3,'9301','LXR'],
    [2022,4,'4475','LYH'],[2022,5,'8501','LZB'],[2022,6,'2073','LZN'],[2022,7,'3833','MBB'],
    [2022,8,'6994','MBM'],[2022,9,'6989','MBZ'],[2022,10,'3393','MCP'],[2022,11,'3508','MDF'],

    [2023,0,'4719','MDR'],[2023,1,'5054','MFF'],[2023,2,'4743','MFY'],[2023,3,'9595','MGM'],
    [2023,4,'5265','MHB'],[2023,5,'3315','MHY'],[2023,6,'5504','MJP'],[2023,7,'2557','MKC'],
    [2023,8,'9413','MKR'],[2023,9,'8331','MLK'],[2023,10,'4232','MLX'],[2023,11,'2483','MMN'],

    [2024,0,'2437','MNB'],[2024,1,'7876','MNS'],[2024,2,'6075','MPK'],[2024,3,'8758','MRD'],
    [2024,4,'8811','MRW'],[2024,5,'8398','MSR'],[2024,6,'9003','MTJ'],[2024,7,'3690','MTV'],
    [2024,8,'2527','MVK'],[2024,9,'1314','MWC'],[2024,10,'7472','MWT'],[2024,11,'7094','MXP'],

    [2025,0,'9791','MYD'],[2025,1,'4213','MYW'],[2025,2,'8554','MZR'],[2025,3,'8598','NBL'],
    [2025,4,'4805','NCH'],[2025,5,'6169','NDF'],[2025,6,'9654','NFB'],[2025,7,'2367','NFP'],
    [2025,8,'4015','NGH'],[2025,9,'4815','NHD'],[2025,10,'5818','NHY'],[2025,11,'5629','NJS'],

    [2026,0,'8861','NKM'],[2026,1,'1897','NKZ'],[2026,2,'2566','NLZ'],[2026,3,'4365','NMT'],
    [2026,4,'6218','NNP'],[2026,5,'9424','NPS'],[2026,6,'6699','NRP'],[2026,7,'2268','NSF']
  ];

  function modernPlateSerial(number, letters){
    const li = idx(letters);
    if(li < 0) return -1;
    const n = Number.parseInt(number, 10);
    if(!Number.isInteger(n) || n < 0 || n > 9999) return -1;
    return li * 10000 + n;
  }

  const preciseModernBoundaries = modernFullMonthEnds
    .map(([year,month,number,letters]) => ({
      year, month, number, letters,
      serial: modernPlateSerial(number, letters)
    }))
    .filter(x => x.serial >= 0)
    .sort((a,b) => a.serial - b.serial);

  function lookupModernPrecise(number, letters){
    const target = modernPlateSerial(number, letters);
    if(target < 0) return null;

    const first = preciseModernBoundaries[0];
    const last = preciseModernBoundaries[preciseModernBoundaries.length - 1];

    // Solo aplicamos esta tabla dentro del intervalo que realmente cubre.
    if(target < first.serial || target > last.serial) return null;

    for(const boundary of preciseModernBoundaries){
      if(target <= boundary.serial){
        return {
          year: boundary.year,
          month: boundary.month,
          estimated: false,
          precision: 'full-plate-month'
        };
      }
    }
    return null;
  }




  // Serie provincial de Santa Cruz de Tenerife (TF), última matrícula de cada año.
  // Fuente histórica usada para estimar el mes dentro de cada año.
  const provincialTF = {
    1980:'3555-M', 1981:'7081-N', 1982:'1713-P', 1983:'5866-S', 1984:'9613-T',
    1985:'7039-V', 1986:'0587-Y', 1987:'1036-AC', 1988:'6781-AG', 1989:'1122-AL',
    1990:'9446-AN', 1991:'5965-AT', 1992:'2927-AW', 1993:'1606-AY', 1994:'9591-BB',
    1995:'8299-BF', 1996:'9422-BJ', 1997:'4954-BN', 1998:'5333-BU', 1999:'0157-BZ',
    2000:'1308-CD'
  };

  // Reglas del sistema provincial 1971-2000:
  // primera letra: sin Ñ, Q ni R; segunda letra: además sin A, E, I, O.
  const provincialFirst = 'ABCDEFGHIJKLMNOPSTUVWXYZ';
  const provincialSecond = 'BCDFGHJKLMNPSTUVWXYZ';

  function suffixRank(suffix){
    suffix=String(suffix||'').toUpperCase();
    if(suffix.length===1){
      const i=provincialFirst.indexOf(suffix);
      return i<0 ? -1 : i*10000;
    }
    if(suffix.length===2){
      const a=provincialFirst.indexOf(suffix[0]);
      const b=provincialSecond.indexOf(suffix[1]);
      if(a<0 || b<0) return -1;
      return (provincialFirst.length + a*provincialSecond.length + b)*10000;
    }
    return -1;
  }

  function provincialSerial(number,suffix){
    const base=suffixRank(suffix);
    if(base<0) return -1;
    const n=parseInt(number,10);
    if(!Number.isFinite(n) || n<0 || n>9999) return -1;
    return base+n;
  }

  function lookupTF(number,suffix){
    const target=provincialSerial(number,suffix);
    if(target<0) return null;
    const years=Object.keys(provincialTF).map(Number).sort((a,b)=>a-b);
    let prevYear=1979;
    let prevSerial=null;

    for(const year of years){
      const [num,suf]=provincialTF[year].split('-');
      const endSerial=provincialSerial(num,suf);
      if(endSerial<0) continue;

      if(target<=endSerial){
        if(prevSerial===null) return {year,month:6,estimated:true};
        const span=Math.max(1,endSerial-prevSerial);
        const pos=Math.max(0,Math.min(span,target-prevSerial));
        const ratio=pos/span;
        const month=Math.max(0,Math.min(11,Math.floor(ratio*12)));
        return {year,month,estimated:true};
      }
      prevYear=year;
      prevSerial=endSerial;
    }
    return null;
  }

  // Referencias mínimas integradas: disponibles incluso si Pages publica solo index.html.
  // Son límites de SERIE, no fechas comprobadas de una matrícula individual.
  const embeddedReferences={
    '2026-09':{date:'2026-09-30',letters:'NSZ',source:'referencia-de-serie'},
    '2026-10':{date:'2026-10-19',letters:'NTJ',source:'referencia-de-serie'}
  };
  let liveData={daily:{},monthEnds:{...embeddedReferences},updatedAt:null};
  let cycleReferences=[{"plate":"C0000BBB","date":"1999-07-27","precision":"range-start","source":"https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/dgt-en-cifras/publicaciones/Anuario_Estadistico_General/Anuario-estadistico-general-2000.pdf"},{"plate":"C0000BPJ","date":"2004-01-01","precision":"range-end","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C0000BRB","date":"2004-11-01","precision":"month-hint","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C0000BSB","date":"2006-03-01","precision":"month-hint","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C0000BTB","date":"2007-06-01","precision":"month-hint","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C0000BVB","date":"2009-07-01","precision":"month-hint","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C0000BWB","date":"2017-06-01","precision":"month-hint","source":"https://matriculasdelmundo.com/fechas-matriculas-motos.php"},{"plate":"C8833BWY","date":"2026-10-19","precision":"observed","source":"https://www.seisenlinea.com/ultima-matricula/"}];
  const status=document.getElementById('dataStatus');
  const plateVisual=document.querySelector('.plate');

  function parsePlate(value){
    const s=value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    let m=s.match(/^C(\d{4})([A-Z]{2,3})$/);
    if(m)return {type:'cycle',number:m[1],letters:m[2]};
    m=s.match(/^(\d{4})([A-Z]{3})$/);
    if(m)return {type:'modern',number:m[1],letters:m[2]};
    m=s.match(/^([A-Z]{1,2})(\d{1,6})([A-Z]{1,2})$/);
    if(m)return {type:'provincial',province:m[1],number:m[2],suffix:m[3]};
    m=s.match(/^([A-Z]{1,2})(\d{1,6})$/);
    if(m)return {type:'provincialNumeric',province:m[1],number:m[2]};
    return null;
  }

  // Los hitos de ciclomotores son independientes de las matrículas ordinarias.
  // Los datos existentes NO contienen un histórico mes a mes completo.
  function lookupCiclomotor(plate){
    if(plate.letters.length!==3 || idx(plate.letters)<idx('BBB'))return null;
    const serial=modernPlateSerial(plate.number,plate.letters);
    const refs=cycleReferences.map(r=>({serial:modernPlateSerial(r.plate.slice(1,5),r.plate.slice(5)),date:r.date,precision:r.precision}))
      .filter(r=>r.serial>=0 && /^\d{4}-\d{2}-\d{2}$/.test(r.date)).sort((a,b)=>a.serial-b.serial);
    if(!refs.length)return {range:'Sin referencias disponibles'};
    // El primer bloque BBB–BPJ es conocido sólo para el intervalo 1999–2004.
    const bbb=modernPlateSerial('0000','BBB'),bpj=modernPlateSerial('0000','BPJ');
    if(serial>=bbb && serial<=bpj)return {range:'1999–2004'};
    const next=refs.find(r=>r.serial>=serial);
    const prev=[...refs].reverse().find(r=>r.serial<=serial);
    if(!next || !prev)return {range:!next?'Fecha pendiente de referencia':'1999–2004'};
    const start=prev.date.slice(0,7),end=next.date.slice(0,7);
    // Un mes sólo se afirma cuando ambos hitos acotan el mismo mes.
    if(start===end){const d=parseYearMonth(start);return {...d,confidence:'bounded'};}
    const startDate=new Date(prev.date+'T00:00:00Z');
    const endDate=new Date(next.date+'T00:00:00Z');
    const span=(endDate-startDate)/(86400000*30.4375);
    if(span>30){
      const from=Number(prev.date.slice(0,4)),to=Number(next.date.slice(0,4));
      return {range:from===to?String(from):`${from}–${to}`};
    }
    // A partir de dos hitos distanciados menos de 30 meses podemos
    // dar un mes aproximado, nunca atribuirle precisión oficial.
    const ratio=(serial-prev.serial)/(next.serial-prev.serial||1);
    const instant=startDate.getTime()+ratio*(endDate.getTime()-startDate.getTime());
    const d=new Date(instant);
    return {year:d.getUTCFullYear(),month:d.getUTCMonth(),estimated:true};
  }

  function parseYearMonth(s){const [year,month]=s.split('-').map(Number);return {year,month:month-1};}
  function lookup(value){
    const plate=parsePlate(value);
    if(!plate)return null;
    if(plate.type==='cycle'){
      return lookupCiclomotor(plate);
    }
    if(plate.type==='modern'){
      if(idx(plate.letters)<idx('BBB'))return null;
      const category='Matrícula ordinaria';
      const precise=lookupModernPrecise(plate.number,plate.letters);
      if(precise)return {...precise,category,note:'Mes calculado mediante fronteras históricas de matrícula completa.'};
      if(modernPlateSerial(plate.number,plate.letters)>modernPlateSerial('2268','NSF')){
        // Los ZIP oficiales sólo contienen LAS TRES LETRAS, no los cuatro números.
        // Una serie puede abarcar más de un mes. Sólo se asigna un mes cuando
        // una referencia anterior y una posterior acotan la misma mensualidad.
        const dates=Object.entries(liveData.daily||{}).filter(([day,letters])=>
          /^\d{4}-\d{2}-\d{2}$/.test(day)&&idx(letters)>=0)
          .sort((a,b)=>a[0].localeCompare(b[0]));
        const target=idx(plate.letters);
        const first=dates.find(([,letters])=>idx(letters)>=target);
        const earlier=[...dates].reverse().find(([,letters])=>idx(letters)<target);
        if(first&&earlier&&first[0].slice(0,7)===earlier[0].slice(0,7))
          return {...parseYearMonth(first[0].slice(0,7)),category};
        // Alternativa: último mes cerrado con serie menor y un día del
        // nuevo mes con serie >= objetivo (suficiente para acotar mes).
        if(first){
          const ym=first[0].slice(0,7);
          const prev=new Date(first[0]+'T12:00:00Z'); prev.setUTCDate(0);
          const previous=prev.toISOString().slice(0,7);
          const prevEnd=(liveData.monthEnds||{})[previous];
          if(prevEnd&&idx(prevEnd.letters)>=0&&idx(prevEnd.letters)<target)
            return {...parseYearMonth(ym),category};
        }
        // Última serie publicada: permite reconocer el mes ACTUAL si ha habido
        // evidencia del comienzo de la serie dentro del mismo mes.
        if(first&&first[0].slice(0,7)===new Date().toISOString().slice(0,7)&&
           earlier&&earlier[0].slice(0,7)===first[0].slice(0,7))
          return {...parseYearMonth(first[0].slice(0,7)),category};
        return {category,note:'Serie posterior al último dato DGT descargado. No se asigna una fecha sin evidencia.'};
      }
      for(const b of boundaries)if(idx(plate.letters)<=b.index)return {year:b.year,month:b.month,category,note:'Estimación con referencia histórica de la serie.'};
      return {category,note:'Sin referencia suficiente.'};
    }
    if(plate.type==='provincial'&&plate.province==='TF'){
      const res=lookupTF(plate.number,plate.suffix);
      return res?{...res,category:'Matrícula provincial TF',note:'Fecha estimada por registros provinciales históricos.'}:null;
    }
    return {category:'Matrícula provincial histórica',note:'Formato reconocido; no hay frontera provincial verificada para calcular el mes.'};
  }
  function formatPlate(value){
    const clean=value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,11);
    let m=clean.match(/^C(\d{0,4})([A-Z]{0,3})$/);
    if(m)return 'C'+(m[1]?' '+m[1]:'')+(m[2]?' '+m[2]:'');
    m=clean.match(/^(\d{0,4})([A-Z]{0,3})$/);
    if(m&&(m[1]||!clean))return m[1]+(m[1].length===4&&m[2]?' ':'')+m[2];
    m=clean.match(/^([A-Z]{1,2})(\d{0,6})([A-Z]{0,2})$/);
    if(m)return m[1]+(m[2]?' '+m[2]:'')+(m[3]?' '+m[3]:'');
    return clean;
  }
  async function refreshCycles(){
    try{
      const res=await fetch('data/ciclomotores.json?t='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw Error('Sin base de ciclomotores');
      const d=await res.json();
      if(Array.isArray(d.references)&&d.references.length>=8){
        cycleReferences=d.references.filter(x=>/^C\d{4}[A-Z]{3}$/.test(x.plate)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date));
      }
    }catch(e){ /* Referencias integradas de respaldo */ }
    updateResult();
  }
  async function refresh(){
    try{
      const res=await fetch('data/dgt.json?t='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw Error(res.status);
      const x=await res.json();
      if(!x||typeof x.monthEnds!=='object')throw Error('Datos inválidos');
      liveData={...x,monthEnds:{...embeddedReferences,...x.monthEnds}};
      const match=typeof x.updatedAt==='string'&&/^(\d{4})-(\d{2})-(\d{2})$/.exec(x.updatedAt);
      status.textContent=match?`Actualizado ${match[3]}-${match[2]}-${match[1]}`:'';
    }catch(e){status.textContent='';}
    updateResult();
  }
  function elapsedSince(year,month){
    const now=new Date();
    let total=(now.getFullYear()-year)*12+(now.getMonth()-month);
    if(total<0) total=0;
    const years=Math.floor(total/12);
    const monthsLeft=total%12;
    const yText=years===1?'1 año':`${years} años`;
    const mText=monthsLeft===1?'1 mes':`${monthsLeft} meses`;
    if(years===0) return mText;
    if(monthsLeft===0) return yText;
    return `${yText} y ${mText}`;
  }

  function updateResult(){
    plateVisual.classList.toggle('cycle',/^C\d/.test(input.value.toUpperCase().replace(/[^A-Z0-9]/g,'')));
    const found=lookup(input.value);
    if(!found){result.replaceChildren();result.classList.remove('show');return;}
    result.replaceChildren();
    function add(cls,text){const span=document.createElement('span');span.className=cls;span.textContent=text;result.appendChild(span);}
    add('result-date',found.range||(found.year&&Number.isInteger(found.month)?`${found.estimated?'≈ ':''}${months[found.month]} de ${found.year}`:'Fecha no disponible'));
    if(found.year&&Number.isInteger(found.month)&&!found.range){
      add('result-star','★');
      add('elapsed',elapsedSince(found.year,found.month));
    }
    result.classList.add('show');
  }
  input.addEventListener('input',()=>{input.value=formatPlate(input.value);updateResult();});
  refresh();
  refreshCycles();
  setInterval(()=>{refresh();refreshCycles();},6*60*60*1000);

})();
</script>
<script>
(() => {
  const result = document.getElementById('result');
  const shell = document.getElementById('resultShell');
  const observer = new MutationObserver(() => shell.classList.toggle('show', result.classList.contains('show') && result.textContent.trim() !== ''));
  observer.observe(result,{attributes:true,childList:true,subtree:true,characterData:true});
})();
</script>
