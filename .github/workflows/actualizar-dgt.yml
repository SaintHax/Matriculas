name: Actualizar matriculas DGT
on:
  schedule:
    - cron: '17 7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-matriculas
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar datos publicos DGT
        run: python scripts/update_dgt.py
      - name: Consultar referencias de ciclomotores
        run: python scripts/update_ciclomotores.py
      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dgt.json data/ciclomotores.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar series DGT'
            git push
          fi
